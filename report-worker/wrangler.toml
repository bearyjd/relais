#
# Relais AI-content report receiver (#258). Deploy per README.md — the KV namespace id and the
# rate-limit salt are environment-specific and are NOT committed.

name = "relais-report"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# No *.workers.dev hostname and no per-version preview URLs: a custom domain is the ONLY intended
# way in. Without these, wrangler defaults workers_dev to TRUE whenever no route is declared — and
# this template ships with the route commented out (see below) — so a fresh deploy would publish a
# second live hostname for the same code and the same KV. Pin it, don't infer it.
workers_dev = false
preview_urls = false

# Reports and rate-limit counters share one namespace, distinguished by key prefix (`report:` /
# `rl:`). Both carry a TTL, so nothing here grows without bound.
#
# COMMENTED OUT ON PURPOSE — uncomment and paste the id from step 1 of README.md.
#
# It cannot ship as `id = ""`: wrangler REJECTS an empty binding id while PARSING the config, before
# running any command, so `wrangler kv namespace create REPORTS` — the very command that produces the
# id — fails too. A commented block is the only shape where step 1 of the runbook can actually run.
# The id stays uncommitted regardless: committing one would point every fork's deploy at this
# account's storage.
#
# [[kv_namespaces]]
# binding = "REPORTS"
# id = "<paste-from-step-1>"

# RATE_LIMIT_SALT is a secret, set with `wrangler secret put` — never in this file.
# See README.md.

[observability]
enabled = true
