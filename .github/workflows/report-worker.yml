name: report-worker

on:
  push:
    branches: ["**"]
    paths:
      - "report-worker/**"
      - ".github/workflows/report-worker.yml"
      # The client half of the report vocabulary. `schema-parity.test.ts` reads these to check the
      # Kotlin enum against the Worker's allowlist, so a reason added on the CLIENT side has to
      # trigger this workflow too — otherwise the drift it guards against lands untested.
      - "Android/src/app/src/main/java/cc/grepon/relais/chat/ContentReportShaping.kt"
      - "Android/src/app/src/main/java/cc/grepon/relais/data/ReportEntities.kt"
  pull_request:
    branches: ["**"]
    paths:
      - "report-worker/**"
      - ".github/workflows/report-worker.yml"
      # The client half of the report vocabulary. `schema-parity.test.ts` reads these to check the
      # Kotlin enum against the Worker's allowlist, so a reason added on the CLIENT side has to
      # trigger this workflow too — otherwise the drift it guards against lands untested.
      - "Android/src/app/src/main/java/cc/grepon/relais/chat/ContentReportShaping.kt"
      - "Android/src/app/src/main/java/cc/grepon/relais/data/ReportEntities.kt"

permissions:
  contents: read

# The report receiver (#258) had NO CI at all: its suite ran only when someone remembered to run it
# locally. That is how a Worker that the runtime refused to start reached `main` "with 24 green
# tests" — nobody had run them since, and nothing would have told them.
#
# The `boots under the Workers runtime` step is the one that matters most and is the reason this
# file exists. `npm test` and `tsc` both load the module into Node, where a value export is just a
# value, and `wrangler deploy --dry-run` only bundles. Neither can see the export constraint that
# made the Worker undeployable; only actually starting workerd can.

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: report-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Bundles
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dist

      # Starts the real runtime against the real entry module and issues one request. Catches
      # anything that makes workerd refuse the module — a value export, a bad binding shape, a
      # top-level throw — none of which the steps above can see. No Cloudflare account required:
      # --local runs workerd on this runner.
      - name: Boots under the Workers runtime
        run: |
          set -euo pipefail

          # The committed wrangler.toml ships the KV block commented out on purpose (see the note
          # there), so bind it in a local-only copy — same shape as README's local-verification step.
          sed 's/^# \[\[kv_namespaces\]\]/[[kv_namespaces]]/; s/^# binding = "REPORTS"/binding = "REPORTS"/; s/^# id = .*/id = "ci"/' \
            wrangler.toml > wrangler.ci.toml
          echo 'RATE_LIMIT_SALT = "ci-only-not-a-real-salt"' > .dev.vars

          npx wrangler dev -c wrangler.ci.toml --port 8787 --local --ip 127.0.0.1 > dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill $DEV_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8787/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "runtime up after ${i}s"
              break
            fi
            if ! kill -0 $DEV_PID 2>/dev/null; then
              echo "::error::the Workers runtime exited instead of serving — the Worker does not start"
              cat dev.log
              exit 1
            fi
            sleep 1
          done

          status=$(curl -s -o /tmp/body -w "%{http_code}" -X POST http://127.0.0.1:8787/report \
            -H 'content-type: application/json' \
            -d '{"reasonId":"other","surface":"chat","excerpt":"ci smoke"}' || true)
          echo "POST /report -> $status $(cat /tmp/body)"
          if [ "$status" != "202" ]; then
            echo "::error::expected 202 from a valid report, got '$status'"
            cat dev.log
            exit 1
          fi
